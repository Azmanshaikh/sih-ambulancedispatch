<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-container": "#daffd1",
                    "surface-dim": "#0a0a0f",
                    "surface": "#0f111a",
                    "tertiary": "#82db7e",
                    "primary": "#ffb3ac",
                    "primary-container": "#930010",
                    "on-surface-variant": "#d8c2bf",
                    "on-tertiary-fixed-variant": "#005312",
                    "on-secondary-fixed": "#001c3a",
                    "surface-container": "#1b1b22",
                    "tertiary-fixed": "#9df898",
                    "on-secondary": "#ffffff",
                    "secondary": "#a5c8ff",
                    "surface-container-high": "#25252c",
                    "outline": "#a08c8a",
                    "on-secondary-container": "#d4e3ff",
                    "on-primary-container": "#ffdad6",
                    "tertiary-fixed-dim": "#82db7e",
                    "secondary-fixed": "#d4e3ff",
                    "primary-fixed": "#ffdad6",
                    "surface-container-low": "#131318",
                    "on-primary": "#690005",
                    "on-error": "#ffffff",
                    "on-tertiary": "#00390a",
                    "inverse-surface": "#e0e0ff",
                    "surface-container-highest": "#303037",
                    "on-tertiary-fixed": "#002204",
                    "error-container": "#93000a",
                    "secondary-fixed-dim": "#a5c8ff",
                    "surface-variant": "#534341",
                    "on-background": "#e0e0ff",
                    "secondary-container": "#004786",
                    "surface-tint": "#ffb3ac",
                    "on-secondary-fixed-variant": "#004786",
                    "primary-fixed-dim": "#ffb3ac",
                    "on-primary-fixed-variant": "#930010",
                    "outline-variant": "#534341",
                    "inverse-on-surface": "#000767",
                    "tertiary-container": "#005312",
                    "inverse-primary": "#ba1a20",
                    "on-error-container": "#ffdad6",
                    "on-primary-fixed": "#410003",
                    "surface-bright": "#38383f",
                    "on-surface": "#e0e0ff",
                    "background": "#0a0a0f",
                    "surface-container-lowest": "#07070a",
                    "error": "#ffb4ab"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-glass {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed dark">
<!-- TopAppBar Section -->
<header class="fixed top-0 w-full z-50 bg-slate-950/80 backdrop-blur-xl border-b border-white/5 shadow-2xl">
<div class="flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-red-500" data-icon="emergency">emergency</span>
<h1 class="text-xl font-black tracking-widest uppercase text-red-500 font-inter headline-md">Sentinel Dispatch</h1>
</div>
<div class="flex items-center gap-4">
<div class="flex flex-col items-end">
<span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Unit 704</span>
<span class="text-[10px] font-bold uppercase tracking-widest text-tertiary">Active</span>
</div>
<div class="w-10 h-10 rounded-full bg-slate-800 border border-white/10 overflow-hidden">
<img alt="Paramedic Profile" class="w-full h-full object-cover" data-alt="Professional portrait of an emergency medical responder in a blue uniform, confident expression, soft clinic lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCtdvI7Dnw4CNQLhD01F9BdBxaI6Wu8OAzciPMLSEh_Z4eG0I3LRA33oRascvVZkvDvYXd0gwK75OeHwEJymzhHRV0P9DJWCIbVlMynHrXuPquFRrXsyoxBez7J2GQc1YQGHj9Kf-0Zjcek3j_mXsF9TB04hn1K83dsCu7frkkdRV7tpkHTwj8CxF6AQxKW4b6pCSQ904fpN8FXG2vt_WV02M3vjTnnaciWIBg3MwqupZjL6TCcvauqAETgPbtSZ8UlOmkWBITOH98C"/>
</div>
</div>
</div>
</header>
<!-- Main Navigation Content: Map Focus -->
<main class="relative h-screen w-full overflow-hidden bg-black">
<!-- Full-Screen Interactive Map -->
<div class="absolute inset-0 z-0">
<img alt="Interactive Emergency Navigation Map" class="w-full h-full object-cover grayscale invert brightness-[0.2] contrast-[1.4]" data-alt="Detailed dark-themed city map top-down view with glowing blue route line and pulsating red and orange traffic heatmap overlays" data-location="New York City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDwxNAakZK3PjlyDQ16iHV3Zs77K7pbirMu1Sg2PjIu-GE5sJ8CvJtThIwDfLphIkDTiRO1YaCYCC1NlN8cy2lM7u6GrEcktpwr76j_37SUQ0_kOLztLHWBWblrz8HFgVGY7-zXaeQxHRK5Di1BoJSx8oTSMxiEhO24YCWRWvao94Sivo8EjJT2wDbxWg7N5FvJsrPPdBZpfvu7LK761xez4600X0aZ8annRZ3hRtAM9-UzPiK1sPpICLnwELLj9Fcqjvt5SlTx-zzv"/>
<!-- Map Overlay: Route Path (SVG Simulation) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="none" viewbox="0 0 1000 1000">
<path class="opacity-90 shadow-[0_0_15px_rgba(100,181,246,0.5)]" d="M200,800 L400,600 L450,400 L700,200" fill="none" stroke="#60a5fa" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"></path>
<!-- Traffic Heatmap Red Zone -->
<circle cx="425" cy="500" fill="url(#redGradient)" fill-opacity="0.3" r="80"></circle>
<defs>
<radialgradient id="redGradient">
<stop offset="0%" stop-color="#ef4444"></stop>
<stop offset="100%" stop-color="#ef4444" stop-opacity="0"></stop>
</radialgradient>
</defs>
</svg>
</div>
<!-- Floating UI Elements (Top Side) -->
<div class="absolute top-24 left-6 z-10 flex flex-col gap-4">
<!-- Status Badge -->
<div class="bg-red-600 px-4 py-2 rounded-full flex items-center gap-2 shadow-xl shadow-red-900/50 animate-pulse">
<span class="material-symbols-outlined text-white text-sm" data-icon="ambulance" data-weight="fill" style="font-variation-settings: 'FILL' 1;">ambulance</span>
<span class="text-white text-xs font-bold uppercase tracking-wider">Status: En Route</span>
</div>
<!-- Direction Indicator Card -->
<div class="bg-slate-900/90 backdrop-blur-md p-4 rounded-xl shadow-2xl w-64 border-l-4 border-red-500 border border-white/10">
<div class="flex items-center justify-between mb-2">
<span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Next Turn</span>
<span class="material-symbols-outlined text-red-500" data-icon="turn_slight_right">turn_slight_right</span>
</div>
<h2 class="text-lg font-bold leading-tight text-white">East 42nd St</h2>
<p class="text-xs text-slate-300 mt-1">Merge into priority medical lane in 400m</p>
</div>
</div>
<!-- Map Controls Floating Bar -->
<div class="absolute top-24 right-6 z-10 flex flex-col gap-2">
<button class="w-12 h-12 bg-slate-900/90 backdrop-blur-md text-white rounded-xl flex items-center justify-center shadow-lg hover:bg-slate-800 transition-colors border border-white/10">
<span class="material-symbols-outlined" data-icon="my_location">my_location</span>
</button>
<button class="w-12 h-12 bg-slate-900/90 backdrop-blur-md text-white rounded-xl flex items-center justify-center shadow-lg hover:bg-slate-800 transition-colors border border-white/10">
<span class="material-symbols-outlined" data-icon="layers">layers</span>
</button>
<button class="w-12 h-12 bg-slate-900/90 backdrop-blur-md text-white rounded-xl flex items-center justify-center shadow-lg hover:bg-slate-800 transition-colors border border-white/10">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<button class="w-12 h-12 bg-slate-900/90 backdrop-blur-md text-white rounded-xl flex items-center justify-center shadow-lg hover:bg-slate-800 transition-colors border border-white/10">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
</div>
<!-- Bottom Sheet Card Overlay -->
<div class="absolute bottom-28 left-4 right-4 z-20 flex justify-center">
<div class="bg-slate-900/95 backdrop-blur-xl rounded-2xl w-full max-w-2xl shadow-2xl p-6 border border-white/10">
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
<!-- Metrics Cluster -->
<div class="flex flex-wrap items-center gap-8">
<div class="flex flex-col">
<span class="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">ETA</span>
<div class="flex items-baseline gap-1">
<span class="text-4xl font-black text-red-500 tracking-tight">8</span>
<span class="text-lg font-bold text-red-500">mins</span>
</div>
</div>
<div class="w-px h-10 bg-white/10 hidden md:block"></div>
<div class="flex flex-col">
<span class="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Distance</span>
<div class="flex items-baseline gap-1">
<span class="text-3xl font-bold tracking-tight text-white">3.2</span>
<span class="text-sm font-medium text-slate-300">km</span>
</div>
</div>
<div class="w-px h-10 bg-white/10 hidden md:block"></div>
<div class="flex flex-col">
<span class="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Traffic</span>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_10px_#3b82f6]"></span>
<span class="text-sm font-bold text-white">MODERATE</span>
</div>
</div>
</div>
<!-- Secondary CTAs -->
<div class="flex gap-3 w-full md:w-auto">
<button class="flex-1 md:flex-none px-6 py-3 rounded-xl border border-blue-500/50 text-blue-400 font-bold text-sm uppercase tracking-wider hover:bg-blue-500/10 transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="refresh">refresh</span>
                            Recalculate
                        </button>
<button class="flex-1 md:flex-none px-6 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm uppercase tracking-wider shadow-lg shadow-blue-900/40 hover:bg-blue-500 transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="headset_mic">headset_mic</span>
                            Dispatch
                        </button>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar Section -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-2xl bg-slate-950/90 backdrop-blur-xl border-t border-white/5 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
<div class="flex justify-around items-center px-4 pb-6 pt-3 w-full">
<!-- Dispatch Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-red-500 active:scale-90 transition-all duration-300" href="#">
<span class="material-symbols-outlined" data-icon="dashboard_customize">dashboard_customize</span>
<span class="font-inter text-[10px] font-bold uppercase tracking-widest mt-1">Dispatch</span>
</a>
<!-- Navigation Tab (Active) -->
<a class="flex flex-col items-center justify-center bg-red-600 text-white rounded-xl px-5 py-2 scale-105 active:scale-90 transition-all duration-300" href="#">
<span class="material-symbols-outlined" data-icon="near_me" data-weight="fill" style="font-variation-settings: 'FILL' 1;">near_me</span>
<span class="font-inter text-[10px] font-bold uppercase tracking-widest mt-1">Navigation</span>
</a>
<!-- Hospitals Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-red-500 active:scale-90 transition-all duration-300" href="#">
<span class="material-symbols-outlined" data-icon="local_hospital">local_hospital</span>
<span class="font-inter text-[10px] font-bold uppercase tracking-widest mt-1">Hospitals</span>
</a>
<!-- Settings Tab -->
<a class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-red-500 active:scale-90 transition-all duration-300" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-inter text-[10px] font-bold uppercase tracking-widest mt-1">Settings</span>
</a>
</div>
</nav>
</body></html>
